// 左下角虚拟摇杆 + 右下角动作按钮（只在触摸设备上创建）
function makeTouch(scene, onDir, onAction) {
    if (!scene.sys.game.device.input.touch) return;
    var W = scene.scale.width, H = scene.scale.height;
    var r = Math.max(52, Math.min(W, H) * 0.13);
    var cx = r + 28, cy = H - r - 28;
    var base = scene.add.circle(cx, cy, r, 0xffffff, 0.16).setScrollFactor(0).setDepth(9999);
    var knob = scene.add.circle(cx, cy, r * 0.42, 0xffffff, 0.42).setScrollFactor(0).setDepth(10000);
    var active = false;
    function setKnob(px, py) {
      var dx = px - cx, dy = py - cy, d = Math.sqrt(dx*dx + dy*dy) || 1;
      var lim = r * 0.62;
      if (d > lim) { dx = dx / d * lim; dy = dy / d * lim; }
      knob.setPosition(cx + dx, cy + dy);
      onDir(dx / lim, dy / lim);
    }
    function reset() { active = false; knob.setPosition(cx, cy); onDir(0, 0); }
    scene.input.on('pointerdown', function (p) {
      if (p.x < W * 0.5) { active = true; setKnob(p.x, p.y); }
    });
    scene.input.on('pointermove', function (p) { if (active) setKnob(p.x, p.y); });
    scene.input.on('pointerup', reset);
    var br = Math.max(34, r * 0.72);
    var bx = W - br - 30, by = H - br - 30;
    var btn = scene.add.circle(bx, by, br, 0x3ecf8e, 0.55).setScrollFactor(0).setDepth(9999)
      .setInteractive();
    scene.add.text(bx, by, '跳', { fontSize: Math.round(br * 0.7) + 'px', color: '#06231a' })
      .setOrigin(0.5).setScrollFactor(0).setDepth(10000);
    btn.on('pointerdown', function () { btn.setAlpha(0.85); onAction(true); });
    btn.on('pointerup', function () { btn.setAlpha(0.55); onAction(false); });
}

 hurt(fall){if(this.finished||(!fall&&this.clock<this.safeUntil))return;this.hp--;this.safeUntil=this.clock+CONFIG.invincible;sound(160,.22,'triangle',55);this.cameras.main.shake(130,.004);this.burst(this.player.x,this.player.y,ART.red,16);if(this.hp<=0){this.end();return;}if(fall){let dest=this.parts.find(p=>p.end>this.player.x+130&&p.items[1].active);if(dest){let b=dest.items[1].body;this.player.body.reset(R(Math.max(b.x+70,this.player.x+30)),CONFIG.ground-100);}else this.player.body.reset(R(this.player.x+180),CONFIG.ground-160);this.player.body.setVelocityY(-180);this.jumps=1;}else this.player.body.setVelocityY(-250);}
 end(){this.finished=true;this.score=R(Math.max(0,(this.player.x-180)/10)+this.collected*CONFIG.coinValue);best=Math.max(best,this.score);try{localStorage.setItem('skybound.best',best);}catch(e){}this.scene.start('Over',{score:this.score,distance:R((this.player.x-180)/10),coins:this.collected});}
 update(time,delta){if(this.finished)return;let dt=Math.min(delta,50);this.clock+=dt;this.runTime+=dt/1000;let p=this.player,b=p.body;this.dir.x=(this.keys.RIGHT.isDown||this.keys.D.isDown?1:0)-(this.keys.LEFT.isDown||this.keys.A.isDown?1:0);this.dir.y=(this.keys.DOWN.isDown||this.keys.S.isDown?1:0);if(this.touchDir.x)this.dir.x=this.touchDir.x;if(this.touchDir.y)this.dir.y=this.touchDir.y;
 let grounded=b.blocked.down||b.touching.down;if(grounded){this.jumps=0;this.lastGround=this.clock;}if(this.jumpUntil>=this.clock){if(this.jumps<2){let first=grounded||this.clock-this.lastGround<95;this.player.body.setVelocityY(first?CONFIG.jump:CONFIG.doubleJump);this.jumps=first?1:2;this.jumpUntil=0;this.burst(p.x,p.y+25,ART.cream,7);sound(first?410:610,.12,'sine',first?650:940);}else this.jumpUntil=0;}
 let dashing=this.clock<this.dashUntil;b.allowGravity=!dashing;let speed=Math.min(CONFIG.maxSpeed,CONFIG.speed+this.runTime*CONFIG.acceleration);b.setVelocityX(dashing?CONFIG.dashSpeed:speed+this.dir.x*65);if(dashing){b.setVelocityY(0);if(R(this.clock/30)%2===0)this.burst(p.x-15,p.y,ART.pale,1);}else if(this.dir.y>.3&&!grounded)b.setVelocityY(Math.min(780,b.velocity.y+35));
 p.play(dashing?'attack':grounded?'walk':'idle',true);p.setAlpha(this.clock<this.safeUntil?(Math.floor(this.clock/90)%2?.35:1):1);
 this.cameras.main.scrollX=Math.max(0,R(p.x-245));parallax(this,this.cameras.main.scrollX);
 while(this.next<p.x+1800)this.generate();let cutoff=p.x-650;this.parts=this.parts.filter(part=>{if(part.end<cutoff){part.items.forEach(o=>o.destroy());return false;}return true;});for(const group of [this.coins,this.hazards])for(const o of [...group.getChildren()]){if(o.x<cutoff)o.destroy();else if(o.getData('type')==='drone')o.body.reset(R(o.x),R(o.getData('base')+Math.sin(this.clock*.002+o.getData('phase'))*18));}
 if(p.y>705)this.hurt(true);if(this.finished)return;this.score=R(Math.max(0,(p.x-180)/10)+this.collected*CONFIG.coinValue);this.scoreText.setText(String(this.score).padStart(6,'0')+'   /   风行积分');this.lifeText.setText('◆ '.repeat(this.hp)+'◇ '.repeat(CONFIG.hp-this.hp)+'     金币  '+this.collected);this.bestText.setText('BEST  '+String(Math.max(best,this.score)).padStart(6,'0')+'     '+R((p.x-180)/10)+' m');this.dashText.setText(this.clock>=this.dashReady?'✦ 冲刺就绪 · X / Shift':'冲刺冷却  '+((this.dashReady-this.clock)/1000).toFixed(1)+' s');
 }
}
class Pause extends Phaser.Scene{constructor(){super('Pause')}create(){veil(this);text(this,560,158,'风，会等你。',44,ART.cream,{fontStyle:'bold'}).setOrigin(.5);text(this,560,220,'已暂停 · 角色与世界均已静止',18,ART.sky).setOrigin(.5);button(this,400,276,320,58,'继续旅程    →',()=>this.resume(),true);this.mute=button(this,400,353,320,52,muted?'声音：关闭':'声音：开启',()=>{muted=!muted;this.mute.t.setText(muted?'声音：关闭':'声音：开启');try{localStorage.setItem('skybound.muted',muted?'1':'0');}catch(e){}});button(this,400,425,320,52,'结束本局并结算',()=>{this.scene.stop();this.scene.get('Game').end();});this.input.keyboard.on('keydown-ESC',()=>this.resume());this.input.keyboard.on('keydown-SPACE',()=>this.resume());}resume(){this.scene.resume('Game');this.scene.stop();}}
class Over extends Phaser.Scene{constructor(){super('Over')}init(data){this.result=data}create(){background(this);veil(this,.88);text(this,560,71,'E N D   O F   T H E   J O U R N E Y',14,ART.gold).setOrigin(.5);text(this,560,118,'每一次坠落，都是下一次起飞。',35,ART.cream,{fontStyle:'bold'}).setOrigin(.5);text(this,560,184,'本 局 积 分',16,ART.sky).setOrigin(.5);text(this,560,219,String(this.result.score).padStart(6,'0'),74,ART.gold,{fontStyle:'bold'}).setOrigin(.5,0);text(this,560,326,'最高纪录  '+best+'     /     '+(this.result.score>=best?'新纪录已刻入云端':'再向远方多走一点'),18,ART.cream).setOrigin(.5);text(this,560,373,'行进  '+this.result.distance+' m       ·       金币  '+this.result.coins,18,ART.sky).setOrigin(.5);button(this,388,426,344,60,'再 次 起 飞    ↗',()=>this.scene.start('Game'),true);button(this,448,504,224,48,'返回启程页',()=>this.scene.start('Menu'));text(this,560,580,'按空格，或轻触上方按钮重开',14,ART.mist).setOrigin(.5);this.input.keyboard.on('keydown-SPACE',()=>this.scene.start('Game'));}}
